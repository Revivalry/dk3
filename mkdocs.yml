site_name: dk3 documentation
site_url: https://dmytrogajewski.github.io/dk3/
site_description: Build and play dk3, configure the engine, and understand its native Zig runtime.
repo_url: https://github.com/dmytrogajewski/dk3
repo_name: dmytrogajewski/dk3
edit_uri: edit/main/docs/
copyright: dk3 code GPL-2.0-or-later · Upstream notices retained · Game data supplied separately
site_dir: zig-out/docs-site
strict: true
theme:
  name: material
  logo: assets/brand.svg
  favicon: assets/brand.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
hooks:
  - docs_site/hooks.py
extra_css:
  - stylesheets/field-manual.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Tutorials:
      - Build the engine: tutorials/build-engine.md
      - Start your first game: tutorials/first-game.md
  - How-to guides:
      - Install a release: how-to/release-installer.md
      - Choose a renderer: how-to/select-renderer.md
      - Configure video: how-to/configure-video.md
      - Update an installation: how-to/update-installation.md
      - Host a multiplayer game: how-to/host-multiplayer.md
      - Run without a display: how-to/headless.md
      - Troubleshoot: how-to/troubleshoot.md
      - Add or change a class: how-to/extend-class.md
  - Reference:
      - Build commands: reference/build.md
      - Files and directories: reference/paths.md
      - Renderer settings: reference/rendering.md
      - Console commands: reference/console.md
      - dkguard: reference/guard.md
      - Asset conversion: reference/assets.md
      - Networking: reference/network.md
      - Save format: reference/saves.md
      - Glossary: reference/glossary.md
  - Explanation:
      - Engine architecture: explanation/architecture.md
      - Rendering: explanation/rendering.md
      - Connected worlds: explanation/worlds.md
      - Assets and installations: explanation/assets.md
  - Project:
      - Development status: project/status.md
      - Contributing: project/development.md
      - Licensing: project/licensing.md
