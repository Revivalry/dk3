site_name: dk3 · Engine field manual
site_url: https://dmytrogajewski.github.io/dk3/
site_description: The dk3 engine, native Zig runtime, Vulkan renderer, game systems, and evidence of what works.
repo_url: https://github.com/dmytrogajewski/dk3
repo_name: dmytrogajewski/dk3
edit_uri: edit/main/docs/
copyright: dk3 code GPL-2.0-or-later · Upstream notices retained · Game data supplied separately
site_dir: zig-out/docs-site
strict: true
theme:
  name: material
  custom_dir: docs_site/overrides
  logo: assets/brand.svg
  favicon: assets/brand.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
hooks:
  - docs_site/hooks.py
extra_css:
  - stylesheets/field-manual.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Start here:
      - Getting started: getting-started.md
      - Current game state: status.md
      - Building: building.md
      - Assets and installation: assets.md
      - Documentation directory: documentation.md
  - Engine:
      - Architecture: engine.md
      - Native runtime: runtime-zig.md
      - Vulkan and remaster: vulkan-remaster.md
      - Resident worlds: seamless-worlds.md
      - Wire protocol: protocol.md
      - Save format: save-format.md
      - Navigation: navigation.md
      - Component provenance: provenance.md
  - Game systems:
      - Acceptance ledger: native-acceptance.md
      - Weapons: weapons-zig.md
      - Class porting contract: class-porting.md
      - Multiplayer: multiplayer.md
      - Online architecture: multiplayer-zig.md
      - Multiplayer bots: bots-zig.md
      - Campaign driver: coop-bot.md
      - Roadmap: rewrite-roadmap.md
  - Asset workshop:
      - Animation authoring: animation-authoring.md
      - Neural characters: neural-assets.md
      - Enemy motion: neural-monsters.md
      - HD weapon pipeline: hd-weapons.md
      - Cinematic reconstruction: cinematic-reconstruction.md
      - Cinematic authored motion: cinematic-authored-motion.md
      - Cinematic performance: cinematic-performance-pivot.md
      - Generated dojo: generated-dojo-model.md
  - Development:
      - Development workflow: development-workflow.md
      - Publication boundaries: publication.md
      - RPM packaging: rpm.md
      - Site maintenance: site-maintenance.md
