name: Engine manual

on:
  push:
    branches: [main]
    paths: ["docs/**", "docs_site/**", "mkdocs.yml", "dkq3/tools/requirements-docs.txt", "README.md", "COPYRIGHT.md", "Makefile", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "docs_site/**", "mkdocs.yml", "dkq3/tools/requirements-docs.txt", "README.md", "COPYRIGHT.md", "Makefile", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dkq3/tools/requirements-docs.txt
      - run: python -m pip install -r dkq3/tools/requirements-docs.txt
      - run: make docs-site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: zig-out/docs-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
